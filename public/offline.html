<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6faf7" />
    <title>Easy English — 오프라인</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6faf7; color: #17211b; font-family: Arial, 'Apple SD Gothic Neo', sans-serif; }
      main { width: min(360px, calc(100% - 48px)); text-align: center; }
      .icon { display: grid; place-items: center; width: 80px; height: 80px; margin: 0 auto 24px; border-radius: 28px; background: #3e8b67; color: #fff; font-size: 36px; }
      h1 { margin: 0; font-size: 26px; } p { margin: 12px 0 0; line-height: 1.6; color: #728078; } button { min-height: 52px; width: 100%; margin-top: 28px; border: 0; border-radius: 16px; background: #3e8b67; color: #fff; font-size: 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">E</div>
      <h1>인터넷 연결이 필요해요</h1>
      <p>연결이 다시 되면 학습을 계속할 수 있어요.<br />이미 열어 본 단어는 오프라인에서도 남아 있을 수 있어요.</p>
      <button onclick="location.reload()">다시 시도하기</button>
    </main>
  </body>
</html>
